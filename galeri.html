<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri - Laboratorium Fisika Medik & Spektroskopi</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --pink: #f8c6d9;
      --pink-dark: #c25a84;
      --pink-light: #ffe6ef;
      --text-dark: #333;
    }

    * {
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--pink-light);
      color: var(--text-dark);
    }

    /* Navbar */
    .navbar {
      background-color: var(--pink-dark) !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 1px;
      color: white !important;
    }

    .nav-link {
      color: white !important;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-link:hover {
      color: var(--pink-light) !important;
    }

    /* Page Header */
    .page-header {
      background: linear-gradient(rgba(194,90,132,0.6), rgba(248,198,217,0.6));
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 8rem 2rem;
      animation: fadeIn 1.2s ease;
    }

    .page-header h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    }

    .page-header p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    /* Custom Tabs */
    .gallery-tabs {
      margin: 3rem 0 2rem;
      text-align: center;
    }

    .gallery-tabs .nav-tabs {
      border: none;
      justify-content: center;
      gap: 1rem;
    }

    .gallery-tabs .nav-link {
      background: white;
      color: var(--pink-dark) !important;
      border: 2px solid var(--pink-dark);
      padding: 0.8rem 2.5rem;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin: 0.5rem;
    }

    .gallery-tabs .nav-link:hover {
      background: var(--pink-dark);
      color: white !important;
      border-color: var(--pink-dark);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(194,90,132,0.3);
    }

    .gallery-tabs .nav-link.active {
      background: var(--pink-dark);
      color: white !important;
      border-color: var(--pink-dark);
      box-shadow: 0 5px 20px rgba(194,90,132,0.4);
    }

    .gallery-tabs .nav-link i {
      color: inherit !important;
    }

    /* Gallery Grid */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
      background: white;
    }

    .gallery-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    /* Modal */
    .modal-content {
      background-color: rgba(0,0,0,0.9);
      border: none;
    }

    .modal-body {
      padding: 1rem;
    }

    .modal-body img {
      width: 100%;
      border-radius: 10px;
      max-height: 80vh;
      object-fit: contain;
    }

    .modal-header {
      border: none;
      padding: 1rem;
    }

    .btn-close {
      background-color: white;
      border-radius: 50%;
      opacity: 1;
    }

    /* Section */
    section {
      padding: 2rem 0 4rem;
    }

    /* Footer */
    footer {
      background-color: var(--pink-dark);
      color: white;
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }

    /* Animations */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .gallery-item {
      animation: fadeIn 0.6s ease;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }
      
      .gallery-item img {
        height: 250px;
      }

      .gallery-tabs .nav-link {
        padding: 0.6rem 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Page Header -->

      <!-- Tab Content -->
      <div class="tab-content" id="galleryTabContent">

        <div class="tab-pane fade show active" id="penelitian" role="tabpanel">

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.13 (1).jpeg">

              </div>
            </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.13.jpeg">
                <img src="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.13.jpeg" alt="Penelitian 2">
              </div>
            </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.14 (1).jpeg">
                <img src="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.14 (1).jpeg" alt="Penelitian 3">
              </div>
            </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.14.jpeg">
                <img src="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.14.jpeg" alt="Penelitian 4">
              </div>
            </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.15.jpeg">
                <img src="images/Galeri Penelitian/WhatsApp Image 2025-11-25 at 19.24.15.jpeg" alt="Penelitian 5">
              </div>
            </div>
          </div>
        </div>

        <!-- Galeri Lab -->
        <div class="tab-pane fade" id="lab" role="tabpanel">
          <div id="galeriLabGrid" class="row">
            <!-- gallery rows will be rendered dynamically from images/Galeri Lab -->

        <!-- Galeri Anggota -->

              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Anggota/WhatsApp Image 2025-11-21 at 00.25.35.jpeg">
                <img loading="lazy" src="images/Galeri Anggota/WhatsApp Image 2025-11-21 at 00.25.35.jpeg" alt="Anggota 2">
              </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Anggota/WhatsApp Image 2025-11-21 at 00.25.46.jpeg">
                <img loading="lazy" src="images/Galeri Anggota/WhatsApp Image 2025-11-21 at 00.25.46.jpeg" alt="Anggota 3">

            </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Anggota/WhatsApp Image 2025-11-21 at 19.17.11.jpeg">

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Anggota/WhatsApp Image 2025-11-25 at 19.03.08 (1).jpeg">
                <img loading="lazy" src="images/Galeri Anggota/WhatsApp Image 2025-11-25 at 19.03.08 (1).jpeg" alt="Anggota 6">

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Anggota/WhatsApp Image 2025-11-25 at 19.03.08.jpeg">
                <img loading="lazy" src="images/Galeri Anggota/WhatsApp Image 2025-11-25 at 19.03.08.jpeg" alt="Anggota 7">
              </div>
            </div>

            <div class="col-md-4">
              <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="images/Galeri Anggota/WhatsApp Image 2025-11-25 at 19.03.12.jpeg">
                <img loading="lazy" src="images/Galeri Anggota/WhatsApp Image 2025-11-25 at 19.03.12.jpeg" alt="Anggota 8">
              </div>

          </div>

      </div>
    </div>
  </section>

  <!-- Image Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="modalImage" src="" alt="Gallery Image">
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p class="mb-0">© 2025 Laboratorium Fisika Medik & Spektroskopi - Universitas Hasanuddin</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Render Galeri Lab dynamically and attach modal image handler
    document.addEventListener('DOMContentLoaded', function () {
      // 1) List semua nama file yang ada di folder 'images/Galeri Lab'
      const galeriLabFiles = [
        'WhatsApp Image 2025-11-21 at 19.18.15.jpeg',
        'WhatsApp Image 2025-11-21 at 19.18.16 (1).jpeg',
        'WhatsApp Image 2025-11-21 at 19.18.16.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.05 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.05.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.06 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.06.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.07 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.07.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.08.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.09 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.09.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.10 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.10 (2).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.10.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.11 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.11.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.12 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.12.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.13 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.13.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.14 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.14.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.15 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.15 (2).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.15.jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.16 (1).jpeg',
        'WhatsApp Image 2025-11-25 at 19.03.16.jpeg'
      ];

      // 2) Render grid from array
      const grid = document.getElementById('galeriLabGrid');
      grid.innerHTML = ''; // clear any placeholder content

      galeriLabFiles.forEach((filename, index) => {
        const col = document.createElement('div');
        col.className = 'col-md-4';

        // build safe URL for filenames that contain spaces or special chars
        const fileUrl = encodeURI('images/Galeri Lab/' + filename);

        col.innerHTML = `
          <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal" data-img="${fileUrl}">
            <img src="${fileUrl}" alt="Lab ${index + 1}">
          </div>
        `;

        grid.appendChild(col);
      });

      // 3) Attach modal click handler to all gallery items (including dynamically added)
      const modalImage = document.getElementById('modalImage');
      const galleryItems = document.querySelectorAll('.gallery-item[data-img]');
      galleryItems.forEach(item => {
        item.addEventListener('click', function () {
          const imgSrc = this.getAttribute('data-img');
          modalImage.src = imgSrc;
        });
      });
    });
  </script>
</body>
</html>
